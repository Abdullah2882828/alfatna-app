let _db;const db=()=>_db||(_db=new Promise((res,rej)=>{const r=indexedDB.open("alfitnah",3);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains("kv"))d.createObjectStore("kv");["projects","convs","msgs","files","snaps"].forEach(n=>{if(!d.objectStoreNames.contains(n))d.createObjectStore(n,{keyPath:"id"})})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
const kv=async(m,k,v)=>{const d=await db();return new Promise((res,rej)=>{const t=d.transaction("kv",m==="get"?"readonly":"readwrite").objectStore("kv");const q=m==="get"?t.get(k):m==="set"?t.put(v,k):t.delete(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})};
async function aesKey(){let k=await kv("get","ckey");if(!k){k=await crypto.subtle.generateKey({name:"AES-GCM",length:256},false,["encrypt","decrypt"]);await kv("set","ckey",k)}return k}
async function encTok(t){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},await aesKey(),new TextEncoder().encode(t));return{iv,ct}}
async function decTok(o){return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:o.iv},await aesKey(),o.ct))}

async function startLogin(){
  const b=$("#ghBtn");b.disabled=true;lmsg("");
  try{
    const F=FB||await fbInit();
    const {T,auth}=F,pv=new T.GithubAuthProvider();["repo","workflow","read:user","user:email"].forEach(s=>pv.addScope(s));
    const res=await T.signInWithPopup(auth,pv),cr=T.GithubAuthProvider.credentialFromResult(res),tok=cr&&cr.accessToken;
    if(!tok)throw{k:"notoken"};
    const u=await ghUser(tok);

    S.user=u;S.token=tok;enter();
  }catch(e){

async function ghUser(t){
  const r=await fetch("https://api.github.com/user",{headers:{Authorization:"Bearer "+t,Accept:"application/vnd.github+json"}});
  if(r.status===401)throw Object.assign(new Error("401"),{auth:true});
  if(r.status===403)throw new Error("rate");
  const j=await r.json();return{login:j.login,name:j.name,avatar:j.avatar_url,email:j.email,url:j.html_url}
}
async function restore(){
  let s;try{s=await kv("get","sess")}catch(e){}

  enter();

}

async function openProj(id){const p=await dbGet("projects",id);if(!p)return;S.pid=id;S.pn=p.name;const c=(await dbAll("convs")).filter(c=>c.pid===id).sort((a,b)=>b.updated-a.updated)[0];if(c)return openConv(c.id);S.cid=null;S.msgs=[];saveLast();return showChat()}
async function tokenScopes(){try{const r=await fetch("https://api.github.com/user",{headers:{Authorization:"Bearer "+S.token}});const h=r.headers.get("x-oauth-scopes");return h===null?null:h.split(",").map(s=>s.trim())}catch(e){return null}}
async function ciDialog(p){
  const g=p.gh,B=`/repos/${g.owner}/${g.repo}`;let run=null,err="";
  try{const r=await gh(`${B}/actions/workflows/build-apk.yml/runs?per_page=1`);run=(r.workflow_runs||[])[0]||null}catch(e){err=e.k==="nf"?"لم يُعثر على workflow باسم build-apk.yml في المستودع. زامن المشروع أولاً.":(GHE[e.k]||GHE.err)}
  const el=$("#dlg"),close=()=>{el.classList.add("hide");el.innerHTML=""};
  el.innerHTML=`<div class="dc wide" role="dialog" aria-modal="true"><h3>حالة البناء</h3><div class="meta"><span class="ltr">${esc(g.owner+"/"+g.repo)}</span></div>`+
  (err?`<div class="msg e">${esc(err)}</div>`:run?`<dl class="kv"><dt>Status</dt><dd class="ltr">${esc(run.status+(run.conclusion?" / "+run.conclusion:""))}</dd><dt>Commit</dt><dd class="ltr">${esc((run.head_sha||"").slice(0,7))}</dd><dt>Date</dt><dd>${fd(Date.parse(run.created_at))}</dd></dl><a class="ltr" href="${esc(run.html_url)}" target="_blank" rel="noopener noreferrer">${esc(run.html_url)}</a>`:`<div class="msg i">لم يُشغَّل البناء بعد.</div>`)+
  `<div id="gprog"></div><div class="row"><button class="btn p" id="cdo">تشغيل البناء الآن</button>${run&&run.conclusion==="failure"?`<button class="btn" id="cfx">إرسال الخطأ للذكاء الاصطناعي</button>`:""}<button class="btn" id="cno">إغلاق</button></div></div>`;
  el.classList.remove("hide");applyLang();$("#cno").onclick=close;el.onkeydown=e=>{if(e.key==="Escape")close()};
  const pl=t=>{const d=document.createElement("div");d.textContent=t;$("#gprog").append(d);applyLang()};
  $("#cdo").onclick=async()=>{try{await gh(`${B}/actions/workflows/build-apk.yml/dispatches`,{method:"POST",body:{ref:g.branch}});pl("✅ "+tr("تم طلب تشغيل البناء. حدّث الحالة بعد دقيقة."))}catch(e){pl("❌ "+(GHE[e.k]||GHE.err)+(e.s?" (HTTP "+e.s+")":""))}};
  const fx=$("#cfx");if(fx)fx.onclick=async()=>{
    let txt="";
    try{const jobs=(await gh(`${B}/actions/runs/${run.id}/jobs`)).jobs||[];
      for(const j of jobs.filter(j=>j.conclusion==="failure")){txt+="Job: "+j.name+"\n";(j.steps||[]).filter(s=>s.conclusion==="failure").forEach(s=>{txt+="Failed step: "+s.name+"\n"});
        try{const r=await fetch(`https://api.github.com${B}/actions/jobs/${j.id}/logs`,{headers:{Authorization:"Bearer "+S.token,Accept:"application/vnd.github+json"}});if(r.ok)txt+="\nLog tail:\n"+scrub((await r.text()).slice(-6000))+"\n"}catch(e){}}
    }catch(e){}
    if(!txt)txt="(تعذر جلب تفاصيل الفشل؛ افتح رابط التشغيل في GitHub وألصق سطور الخطأ في المحادثة)";
    close();await openProj(p.id);await loadPF();
    await fixWith("فشل بناء APK في GitHub Actions بالتفاصيل التالية:\n"+txt+"\nأصلح الملفات المسببة للفشل وأعد الملفات المعدّلة أو الناقصة كاملة.");
  };
}

/* ---------- views ---------- */
function showLogin(m,retry){$("#app").classList.add("hide");$("#login").classList.remove("hide");lmsg(m,"e",retry)}
async function enter(){$("#login").classList.add("hide");$("#app").classList.remove("hide");buildNav();await restoreLast();await loadProvs();showChat();try{navigator.storage.persist()}catch(e){}}
const NAV=[["chat","💬","محادثة جديدة"],["history","🕑","المحادثات السابقة"],["projects","📁","المشاريع"],["fav","⭐","المفضلة"],["ver","🕘","الإصدارات"],["github","GH","GitHub"],["prov","🔑","المزودات والذكاء الاصطناعي"],["settings","⚙️","الإعدادات"],["dev","🛠","المطورين"],["account","👤","الحساب"]];
const PHASE={fav:"later",ver:14};
function navHtml(){return `<img class="big" src="${LOGO}" alt="الفطنة">`+NAV.map(n=>`<button class="nv" data-v="${n[0]}"><span>${n[1]}</span>${n[2]}</button>`).join("")+`<span class="sp"></span><button class="nv" data-v="logout"><span>🚪</span>تسجيل الخروج</button>`}
function buildNav(){const h=navHtml();$("#side").innerHTML=h;$("#drawer").innerHTML=h;document.querySelectorAll(".nv").forEach(b=>b.onclick=()=>{closeDrawer();go(b.dataset.v==="chat"?"newchat":b.dataset.v)})}
function closeDrawer(){$("#drawer").classList.add("hide");$("#scrim").classList.add("hide")}
function tab(id){if(id==="pPrev"&&S.pt==="view"&&S.dirty&&typeof renderPrev==="function"){S.dirty=false;renderPrev()}document.body.classList.toggle("sv",id==="pSet");document.querySelectorAll(".pane").forEach(p=>p.classList.toggle("on",p.id===id));document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===id))}
function go(v){
  if(v==="logout")return logout();
  S.view=v;document.querySelectorAll("#side .nv").forEach(b=>b.classList.toggle("on",b.dataset.v===v));
  if(v==="newchat"){if(S.busy&&S.ctl)S.ctl.abort();S.pid=null;S.pn="";setMode("chat");S.cid=null;S.msgs=[];S.pf={};S.pfPid=null;S.gh=null;S.cur=null;S.perr=[];S.entry=null;saveLast();return showChat()}
  if(v==="chat"){S.cid=null;S.msgs=[];saveLast();return showChat()}
  if(PHASE[v]){toast(PHASE[v]==="later"?"هذه الميزة تُضاف لاحقاً":tr("هذه الشاشة تُبنى في المرحلة")+" "+PHASE[v]);return}
  const B0=$("#setBody");B0.onclick=null;
  if(v==="projects")return viewProjects(B0);
  if(v==="history")return viewHistory(B0);
  if(v==="prov")return viewProviders(B0);
  if(v==="github")return viewGitHub(B0);
  if(v==="dev")return viewDev(B0);
  const card=(t,b)=>`<div class="card"><h3>${t}</h3>${b}</div>`;
  const u=S.user,B=$("#setBody");
  const prof=u?`<div class="prof"><img src="${esc(u.avatar)}" alt=""><div><b>${esc(u.name||u.login)}</b><div class="ltr" style="color:var(--mu)">@${esc(u.login)}</div></div></div><dl class="kv" style="margin-top:10px"><dt>الحالة</dt><dd>GitHub متصل ✅</dd><dt>البريد</dt><dd class="ltr">${esc(u.email||"غير متاح")}</dd>${S.at?`<dt>تاريخ الربط</dt><dd>${fd(S.at)}</dd>`:""}</dl>`:`<div class="msg i">وضع معاينة التصميم: لا يوجد حساب GitHub متصل.</div>`;
  if(v==="account")B.innerHTML=card("الحساب",prof)+`<button class="btn" id="lo">تسجيل الخروج</button>`;
  else if(v==="settings"){const c=cfg();B.innerHTML=langCard()+card("GitHub",prof)+card("إعداد Firebase",`<dl class="kv"><dt>authDomain</dt><dd class="ltr">${esc(c.authDomain||"—")}</dd><dt>projectId</dt><dd class="ltr">${esc(c.projectId||"—")}</dd><dt>الصلاحيات</dt><dd class="ltr">repo, workflow, read:user, user:email</dd></dl><p style="font-size:13px;color:var(--mu)">صلاحية repo مطلوبة لإنشاء المستودعات الخاصة والمزامنة. يُحفظ توكن GitHub مشفراً بـ AES-GCM في IndexedDB.</p>`)+`<button class="btn" id="lo">${u?"فصل GitHub وتسجيل الخروج":"العودة لشاشة الدخول"}</button>`;
  }
  const lo=$("#lo");if(lo)lo.onclick=()=>logout(!u);
  document.querySelectorAll(".lg").forEach(b=>b.onclick=()=>setLang(b.dataset.l));
  applyLang();tab("pSet");
}
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- chat shell ---------- */
const SUG=["ابنِ لي موقع متجر","حلل هذا المشروع","أنشئ لي تطبيق مهام","حوّل هذه الفكرة إلى موقع"];

function fmt(n){return n<1024?n+" B":n<1048576?(n/1024).toFixed(1)+" KB":(n/1048576).toFixed(1)+" MB"}
function renderFiles(){
  const b=$("#files");b.innerHTML="";
  S.files.forEach((f,i)=>{const d=document.createElement("div");d.className="fc";
    if(f.type.startsWith("image/")){const im=document.createElement("img");im.alt="";im.src=f.url;d.append(im)}
    const s=document.createElement("span");s.textContent=f.name+" · "+(f.type.split("/")[1]||"ملف")+" · "+fmt(f.size);
    const x=document.createElement("button");x.textContent="✕";x.setAttribute("aria-label","حذف "+f.name);x.onclick=()=>{if(f.url)URL.revokeObjectURL(f.url);S.files.splice(i,1);renderFiles()};
    d.append(s,x);b.append(d)});
}

$("#ghBtn").onclick=startLogin;$("#lang").onclick=$("#lang2").onclick=()=>setLang(L==="en"?"ar":"en");

document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>tab(b.dataset.t));

$("#fi").onchange=e=>{[...e.target.files].forEach(f=>S.files.push({name:f.name,type:f.type||"ملف",size:f.size,url:f.type.startsWith("image/")?URL.createObjectURL(f):null,file:f}));e.target.value="";renderFiles()};

  langBtns();applyLang();
  ls.del("cfg.cid");ls.del("cfg.wurl");ls.del("fb.cfg");fbInit().catch(()=>{});
